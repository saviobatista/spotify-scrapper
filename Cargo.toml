[package]
name = "spotify-dl"
version = "0.1.0"
edition = "2021"
description = "Baixa o video de um embedding de episodio/serie do Spotify via API publica (sem navegador)"

[[bin]]
name = "spotify-dl"
path = "src/main.rs"

[dependencies]
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
